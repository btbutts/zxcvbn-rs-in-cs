[package]
name = "zxcvbn_ffi"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "C ABI FFI wrapper for the Rust zxcvbn password strength estimator with serde JSON output"

[lib]
name = "zxcvbn_ffi"
crate-type = ["cdylib", "rlib"]

[dependencies]
zxcvbn = { version = "3.1.1", features = ["ser"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
